# Targeted for execution with Ansible 2.21.4.
---
- hosts: localhost
  tasks:
    - name: Load instance metadata variables
      include_tasks: ansible/playbook/variables.yml

    - name: Environment bootstrap
      include_tasks: ansible/playbook/bootstrap.yml

    - name: Update Cloudflare DNS A record
      include_tasks: ansible/playbook/update-cloudflare-dns-a-record.yml
