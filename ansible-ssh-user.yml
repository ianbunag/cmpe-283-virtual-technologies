# Targeted for execution with Ansible 2.21.4.
---
- hosts: localhost
  vars:
    # Ansible's pipx virtual environment under /root is inaccessible to unprivileged become users.
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Load instance metadata variables
      include_tasks: ansible/ssh-user/variables.yml

    - name: Execute user-scoped setup tasks
      block:
        - name: Environment bootstrap
          include_tasks: ansible/ssh-user/bootstrap.yml

        - name: Sync git repository
          include_tasks: ansible/ssh-user/sync-git-repository.yml
      become: true
      become_user: "{{ ssh_username }}"
