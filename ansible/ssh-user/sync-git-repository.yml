# Targeted for execution with Ansible 2.9.27.
---
- name: Configure git user name
  git_config:
    name: user.name
    scope: global
    value: "{{ git_name }}"

- name: Configure git user email
  git_config:
    name: user.email
    scope: global
    value: "{{ git_email }}"

- name: Clone git repository into documents
  git:
    repo: "{{ git_repository }}"
    dest: "{{ git_repository_dir }}"
    accept_hostkey: yes

- name: Check repository working tree status
  command: git status --porcelain
  args:
    chdir: "{{ git_repository_dir }}"
  register: git_status_check
  changed_when: false
  failed_when: false

- name: Pull latest repository changes if working tree is clean
  command: git pull
  args:
    chdir: "{{ git_repository_dir }}"
  when:
    - git_status_check.rc == 0
    - git_status_check.stdout == ""
