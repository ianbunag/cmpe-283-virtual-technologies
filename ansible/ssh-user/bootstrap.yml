# Targeted for execution with Ansible 2.9.27.
---
- name: Create documents directory
  file:
    path: "{{ documents_dir }}"
    state: directory
    mode: "0755"

- name: Create remote development directory
  file:
    path: "{{ remote_development_dir }}"
    state: directory
    mode: "0755"

- name: Configure shell aliases
  lineinfile:
    path: "/home/{{ ssh_username }}/.bashrc"
    line: "{{ item }}"
    state: present
    create: yes
    mode: "0644"
  loop:
    - 'alias history="history 1"'
    - 'alias h="history"'
    - 'alias g="git"'
